# BMC-K4510 segmented program (K-03): a "K4SG" header, then the main program
# at $6000, then overlays both linked for $4000 (block 2) but stored at
# different physical addresses. prg0.s's 4-byte HEADER goes nowhere.
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0400;
}
MEMORY {
    ZP:   file = "", define = yes, start = $0040, size = $0024;
    JUNK: file = "",               start = $5FFC, size = $0004;
    HDR:  file = %O,               start = $0000, size = $0100;
    PRG:  file = %O, define = yes, start = $6000, size = $4000;
    OVL1: file = %O, define = yes, start = $4000, size = $2000;
    OVL2: file = %O, define = yes, start = $4000, size = $2000;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    HEADER:   load = JUNK, type = ro;
    SEGHDR:   load = HDR,  type = ro;
    STARTUP:  load = PRG,  type = ro;
    ONCE:     load = PRG,  type = ro, optional = yes;
    CODE:     load = PRG,  type = ro;
    RODATA:   load = PRG,  type = ro;
    DATA:     load = PRG,  type = rw;
    BSS:      load = PRG,  type = bss, define = yes;
    OVL1:     load = OVL1, type = ro;
    OVL1R:    load = OVL1, type = ro, optional = yes;
    OVL2:     load = OVL2, type = ro;
    OVL2R:    load = OVL2, type = ro, optional = yes;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
}

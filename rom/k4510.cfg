# BMC-K4510 system ROM: 24 KB image covering $A000-$FFFF. The $D000 page is
# the I/O hole (filled, never read as ROM). RAM: $0200-$07FF data + bss + C
# stack (block 0 only: programs may MAP $2000-$5FFF). $6000-$9FFF is for
# programs, $5300-$5FFF is free.
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0200;
}
MEMORY {
    ZP:   file = "", define = yes, start = $0002, size = $0020;
    RAM:  file = "", define = yes, start = $0200, size = $0100;   # DATA
    BSSR: file = "", define = yes, start = $0440, size = $01C0;   # BSS; $0300-$043F belongs to programs (EhBASIC page 3)
    STK:  file = "", define = yes, start = $0600, size = $0200;   # C stack grows down from $0800
    ROM1: file = %O, define = yes, start = $A000, size = $3000, fill = yes, fillval = $FF;
    HOLE: file = %O,               start = $D000, size = $1000, fill = yes, fillval = $FF;
    ROM2: file = %O, define = yes, start = $E000, size = $1F00, fill = yes, fillval = $FF;
    STUB: file = %O,               start = $FF00, size = $0080, fill = yes, fillval = $FF;   # always-ROM page: the system-call stub
    JTAB: file = %O,               start = $FF80, size = $0018, fill = yes, fillval = $FF;   # the jump table
    STB2: file = %O,               start = $FF98, size = $0062, fill = yes, fillval = $FF;
    VEC:  file = %O,               start = $FFFA, size = $0006, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    STARTUP:  load = ROM2, type = ro;
    ONCE:     load = ROM2, type = ro, optional = yes;
    CODE:     load = ROM1, type = ro;
    CODE2:    load = ROM2, type = ro;
    RODATA:   load = ROM1, type = ro;
    DATA:     load = ROM2, type = rw, run = RAM, define = yes;
    BSS:      load = BSSR, type = bss, define = yes;
    STUB:     load = STUB, type = ro;
    JUMPTAB:  load = JTAB, type = ro;
    STUB2:    load = STB2, type = ro;
    VECTORS:  load = VEC,  type = ro;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
}

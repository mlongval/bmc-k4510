# BMC-K4510 system ROM: 8 KB at $E000-$FFFF, RAM for data/bss/stack below.
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0400;
}
MEMORY {
    ZP:   file = "", define = yes, start = $0002, size = $001E;
    RAM:  file = "", define = yes, start = $0200, size = $0600;   # data+bss  $0200-$07FF  (screen at $0800)
    ROM:  file = %O, define = yes, start = $E000, size = $1FFA, fill = yes, fillval = $FF;
    VEC:  file = %O,               start = $FFFA, size = $0006, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    STARTUP:  load = ROM, type = ro;
    ONCE:     load = ROM, type = ro, optional = yes;
    CODE:     load = ROM, type = ro;
    RODATA:   load = ROM, type = ro;
    DATA:     load = ROM, type = rw, run = RAM, define = yes;
    BSS:      load = RAM, type = bss, define = yes;
    JUMPTAB:  load = ROM, type = ro, start = $FF80;
    VECTORS:  load = VEC, type = ro;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
}
